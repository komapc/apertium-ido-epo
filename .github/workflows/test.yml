name: regtest

on:
  push:
    branches: [main]
  pull_request:

env:
  # The apertium-epo revision prod serves (tradukilo.lipu.dev/api/status,
  # repo "epo"). Prod's host (translator/infra/host) tracks upstream
  # apertium/apertium-epo master; bump this pin when prod's hash changes.
  APERTIUM_EPO_REPO: https://github.com/apertium/apertium-epo.git
  APERTIUM_EPO_REF: 817c60b070a8c74ae9042d01ad0bf20c288008a7
  # The nightly apt repo keeps no old versions, so the toolchain is pinned by
  # caching its .debs under this key. Change the key to take a newer nightly
  # (and re-run the Tatoeba gate: a toolchain change can move chrF).
  TOOLCHAIN_KEY: apertium-nightly-noble-2026-11-17

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Restore Apertium toolchain (.debs)
        id: toolchain
        uses: actions/cache@v6
        with:
          path: ~/apertium-debs
          key: ${{ env.TOOLCHAIN_KEY }}

      - name: Install Apertium toolchain
        run: |
          set -euo pipefail
          if [ "${{ steps.toolchain.outputs.cache-hit }}" != true ]; then
            wget -q https://apertium.projectjj.com/apt/install-nightly.sh -O - | sudo bash
            mkdir -p ~/apertium-debs/partial
            sudo apt-get install -y -q --download-only -o Dir::Cache::archives="$HOME/apertium-debs" \
              apertium-all-dev apertium-regtest
            sudo rm -rf ~/apertium-debs/partial ~/apertium-debs/lock
            sudo chown -R "$USER" ~/apertium-debs
            # Keep only the projectjj packages (versions end in ~noble1/~sid1);
            # Ubuntu's own come from the runner's archive.
            find ~/apertium-debs -name '*.deb' ! -name '*~noble*' ! -name '*~sid*' -delete
          else
            sudo apt-get update -q
          fi
          sudo apt-get install -y -q ~/apertium-debs/*.deb

      - name: Record toolchain versions
        run: |
          {
            echo "### Toolchain (cache key \`$TOOLCHAIN_KEY\`, hit: ${{ steps.toolchain.outputs.cache-hit || false }})"
            echo '```'
            dpkg-query -W -f='${Package} ${Version}\n' lttoolbox apertium cg3 \
              apertium-lex-tools apertium-separable apertium-regtest
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          path: apertium-ido-epo

      # configure.ac prefers ../apertium-ido and ../apertium-epo when present.
      - name: Build apertium-ido
        run: |
          git clone --depth 1 https://github.com/komapc/apertium-ido.git
          cd apertium-ido
          echo "apertium-ido $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          touch NEWS README AUTHORS ChangeLog COPYING
          ./autogen.sh && ./configure && make -j4

      - name: Build apertium-epo (pinned to prod's revision)
        run: |
          git init -q apertium-epo
          cd apertium-epo
          git fetch -q --depth 1 "$APERTIUM_EPO_REPO" "$APERTIUM_EPO_REF"
          git checkout -q FETCH_HEAD
          echo "apertium-epo $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          ./autogen.sh && ./configure && make -j4

      - name: Build apertium-ido-epo
        working-directory: apertium-ido-epo
        run: ./autogen.sh && ./configure && make -j4

      - name: Regression tests (apertium-regtest)
        working-directory: apertium-ido-epo
        run: make test

      - name: Transfer-rule smoke tests (test_syntax_gaps.sh)
        working-directory: apertium-ido-epo
        run: test/test_syntax_gaps.sh

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apertium-ido-epo/dev/requirements-eval.txt

      - name: Tatoeba held-out chrF gate
        working-directory: apertium-ido-epo
        run: |
          pip install -q -r dev/requirements-eval.txt
          python dev/eval_tatoeba.py --hyp-dir "$RUNNER_TEMP/tatoeba"

      - name: Upload Tatoeba translations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tatoeba-translations
          path: ${{ runner.temp }}/tatoeba
          if-no-files-found: ignore
